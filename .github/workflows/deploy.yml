# Deploy to Cloudflare Workers whenever a release is published.
# One-time setup (D1 database + API token + repo secret):
# see README.md → "Deploy to Cloudflare".

name: Deploy to Cloudflare on release

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Typecheck, unit tests, build client
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Fail fast if D1 is not configured yet
        run: |
          if grep -q 'local-dev-placeholder' wrangler.jsonc; then
            echo "::error::D1 database_id is still the local placeholder. Run 'npx wrangler d1 create you-know', paste the printed database_id into wrangler.jsonc, commit, then re-run."
            exit 1
          fi

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply you-know --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment summary
        run: |
          echo "### Deployed ${{ github.event.release.name || github.sha }} to Cloudflare Workers" >> $GITHUB_STEP_SUMMARY
          echo "- Worker: you-know → https://you-know.<your-subdomain>.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "- D1: migrations applied to you-know" >> $GITHUB_STEP_SUMMARY
